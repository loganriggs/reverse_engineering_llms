# Frozen confirmatory settings used for depth-four seed replications.
seeds: [0, 1, 2]
train_per_stratum: 128
width: 96
heads: 3
depths: [4]
rhos: [0.0, 0.5, 1.0]
mlp_kinds: [swiglu, bilinear]
optimizer: adamw
learning_rate: 0.001
batch_size: 256
answer_weight: 4.0
initial_steps: 2000
maximum_steps: 20000
validation_interval: 250
fidelity_gate:
  trained_template_accuracy: 0.97
  heldout_template_accuracy: 0.95
audits:
  random_rotations: 100
  semantic_transfer_examples_per_transition: 128
  semantic_transfer_channels: [8, 32]
  constraint_panel_size: 40
  constraint_source_count: 6
  finite_edit_scales: [0.25, 1.0, 4.0]

