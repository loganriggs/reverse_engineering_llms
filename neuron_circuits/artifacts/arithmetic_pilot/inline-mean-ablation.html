<div id="large-corpus-mean-ablation">
  <style>
    #large-corpus-mean-ablation { color: var(--foreground); font-family: system-ui, sans-serif; }
    #large-corpus-mean-ablation h2 { margin: 0 0 16px; font-size: 20px; line-height: 1.2; }
    #large-corpus-mean-ablation h3 { margin: 0 0 6px; font-size: 15px; }
    #large-corpus-mean-ablation .plots { display: grid; gap: 22px; }
    #large-corpus-mean-ablation svg { display: block; width: 100%; height: auto; }
    #large-corpus-mean-ablation text { fill: var(--foreground); font-size: 12px; }
    #large-corpus-mean-ablation .value { font-size: 13px; font-weight: 700; }
    #large-corpus-mean-ablation .frame { fill: none; stroke: var(--border); }
    #large-corpus-mean-ablation .grid { stroke: var(--border); stroke-opacity: .55; }
    #large-corpus-mean-ablation .zero { fill: var(--viz-series-1); }
    #large-corpus-mean-ablation .task { fill: var(--viz-series-2); }
    #large-corpus-mean-ablation .corpus-old { fill: var(--viz-series-6); }
    #large-corpus-mean-ablation .corpus-new { fill: var(--viz-series-4); }
  </style>
  <h2>Mean ablation at 20% retained activations</h2>
  <div class="plots">
    <section aria-label="Exact accuracy comparison">
      <h3>Exact-answer accuracy</h3>
      <svg viewBox="0 0 360 265" role="img" aria-label="At 20 percent retained activations, zero ablation has 83.3 percent accuracy, arithmetic mean 100 percent, corpus mean with zero ranking 25 percent, and corpus mean with adjusted ranking 91.7 percent.">
        <rect class="frame" x="42" y="10" width="308" height="190"></rect>
        <line class="grid" x1="42" y1="200" x2="350" y2="200"></line><line class="grid" x1="42" y1="105" x2="350" y2="105"></line><line class="grid" x1="42" y1="10" x2="350" y2="10"></line>
        <text x="36" y="204" text-anchor="end">0</text><text x="36" y="109" text-anchor="end">50</text><text x="36" y="14" text-anchor="end">100%</text>
        <rect class="zero" x="57" y="41.7" width="55" height="158.3"></rect><rect class="task" x="131" y="10" width="55" height="190"></rect>
        <rect class="corpus-old" x="205" y="152.5" width="55" height="47.5"></rect><rect class="corpus-new" x="279" y="25.8" width="55" height="174.2"></rect>
        <text class="value" x="84.5" y="35" text-anchor="middle">83.3%</text><text class="value" x="158.5" y="25" text-anchor="middle">100%</text>
        <text class="value" x="232.5" y="146" text-anchor="middle">25.0%</text><text class="value" x="306.5" y="20" text-anchor="middle">91.7%</text>
        <text x="84.5" y="218" text-anchor="middle"><tspan x="84.5">Zero</tspan></text>
        <text x="158.5" y="218" text-anchor="middle"><tspan x="158.5">Arithmetic</tspan><tspan x="158.5" dy="13">mean</tspan></text>
        <text x="232.5" y="218" text-anchor="middle"><tspan x="232.5">Corpus,</tspan><tspan x="232.5" dy="13">zero rank</tspan></text>
        <text x="306.5" y="218" text-anchor="middle"><tspan x="306.5">Corpus,</tspan><tspan x="306.5" dy="13">adjusted</tspan></text>
      </svg>
    </section>
    <section aria-label="KL divergence comparison">
      <h3>Median full-vocabulary KL divergence · lower is better</h3>
      <svg viewBox="0 0 360 265" role="img" aria-label="At 20 percent retained activations, median KL is 0.249 for zero ablation, 0.071 for arithmetic mean, 1.033 for corpus mean with zero ranking, and 0.145 for corpus mean with adjusted ranking.">
        <rect class="frame" x="42" y="10" width="308" height="190"></rect>
        <line class="grid" x1="42" y1="200" x2="350" y2="200"></line><line class="grid" x1="42" y1="113.6" x2="350" y2="113.6"></line><line class="grid" x1="42" y1="27.3" x2="350" y2="27.3"></line>
        <text x="36" y="204" text-anchor="end">0</text><text x="36" y="118" text-anchor="end">0.5</text><text x="36" y="31" text-anchor="end">1.0</text>
        <rect class="zero" x="57" y="157.0" width="55" height="43.0"></rect><rect class="task" x="131" y="187.7" width="55" height="12.3"></rect>
        <rect class="corpus-old" x="205" y="21.6" width="55" height="178.4"></rect><rect class="corpus-new" x="279" y="175.0" width="55" height="25.0"></rect>
        <text class="value" x="84.5" y="151" text-anchor="middle">0.249</text><text class="value" x="158.5" y="181" text-anchor="middle">0.071</text>
        <text class="value" x="232.5" y="16" text-anchor="middle">1.033</text><text class="value" x="306.5" y="169" text-anchor="middle">0.145</text>
        <text x="84.5" y="218" text-anchor="middle">Zero</text>
        <text x="158.5" y="218" text-anchor="middle"><tspan x="158.5">Arithmetic</tspan><tspan x="158.5" dy="13">mean</tspan></text>
        <text x="232.5" y="218" text-anchor="middle"><tspan x="232.5">Corpus,</tspan><tspan x="232.5" dy="13">zero rank</tspan></text>
        <text x="306.5" y="218" text-anchor="middle"><tspan x="306.5">Corpus,</tspan><tspan x="306.5" dy="13">adjusted</tspan></text>
      </svg>
    </section>
  </div>
</div>
